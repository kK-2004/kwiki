spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: kwiki
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # Redis 支持为可选开启：com.kwiki.infrastructure.redis.KwikiRedisConfiguration
      # 仅在 kk.common.redis.enabled=true 时才重新导入这两个自动配置，
      # 因此在禁用期间 spring.data.redis.*（以及任何客户端）不会被读取或创建。
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${KWIKI_MYSQL_URL}
    username: ${KWIKI_MYSQL_USERNAME}
    password: ${KWIKI_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 时间戳以 UTC Instant 形式持久化；告知 Hibernate 如何将
        # JDBC 连接对齐到 UTC，使 DATETIME 列无损往返。
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
  data:
    redis:
      host: ${KWIKI_REDIS_HOST}
      port: ${KWIKI_REDIS_PORT:6379}
      password: ${KWIKI_REDIS_PASSWORD:}
      database: ${KWIKI_REDIS_DATABASE:0}
  elasticsearch:
    uris: ${KWIKI_ELASTICSEARCH_URIS}
    # basic 认证（为空则不启用）；API key 使用 kwiki.elasticsearch.api-key
    username: ${KWIKI_ELASTICSEARCH_USERNAME:}
    password: ${KWIKI_ELASTICSEARCH_PASSWORD:}

logging:
  level:
    kwiki.agentic.debug: ${KWIKI_AGENTIC_LOG_LEVEL:DEBUG}

kwiki:
  time:
    display-zone: ${KWIKI_TIME_DISPLAY_ZONE:Asia/Shanghai}
  graph:
    enabled: ${KWIKI_GRAPH_ENABLED:false}
    algorithm-mode: ${KWIKI_GRAPH_ALGORITHM_MODE:ARCADEDB_NATIVE_UNWEIGHTED}
    schedule-cron: ${KWIKI_GRAPH_SCHEDULE_CRON:0 0 2 * * *}
    schedule-zone: ${KWIKI_GRAPH_SCHEDULE_ZONE:Asia/Shanghai}
    auto-publish: ${KWIKI_GRAPH_AUTO_PUBLISH:false}
    read-lease-duration: ${KWIKI_GRAPH_READ_LEASE_DURATION:10m}
    retention-min-snapshots: ${KWIKI_GRAPH_RETENTION_MIN_SNAPSHOTS:2}
    retirement-grace: ${KWIKI_GRAPH_RETIREMENT_GRACE:30m}
    capacity:
      max-entities: ${KWIKI_GRAPH_MAX_ENTITIES:50000}
      max-relations: ${KWIKI_GRAPH_MAX_RELATIONS:250000}
      max-relation-sources: ${KWIKI_GRAPH_MAX_RELATION_SOURCES:1000000}
      max-communities: ${KWIKI_GRAPH_MAX_COMMUNITIES:5000}
      warn-entities: ${KWIKI_GRAPH_WARN_ENTITIES:20000}
      warn-relations: ${KWIKI_GRAPH_WARN_RELATIONS:100000}
      max-hops: ${KWIKI_GRAPH_MAX_HOPS:2}
      max-edges-per-node: ${KWIKI_GRAPH_MAX_EDGES_PER_NODE:50}
      max-edges-total: ${KWIKI_GRAPH_MAX_EDGES_TOTAL:500}
    offline:
      max-concurrency: ${KWIKI_GRAPH_OFFLINE_MAX_CONCURRENCY:2}
      min-interval: ${KWIKI_GRAPH_OFFLINE_MIN_INTERVAL:1s}
      max-attempts: ${KWIKI_GRAPH_OFFLINE_MAX_ATTEMPTS:3}
  external:
    arcadedb:
      endpoint: ${KWIKI_ARCADEDB_ENDPOINT:}
      database: ${KWIKI_ARCADEDB_DATABASE:kwiki}
      token: ${KWIKI_ARCADEDB_TOKEN:}
      connect-timeout: ${KWIKI_ARCADEDB_CONNECT_TIMEOUT:3s}
      query-timeout: ${KWIKI_ARCADEDB_QUERY_TIMEOUT:1500ms}
      batch-write-timeout: ${KWIKI_ARCADEDB_BATCH_WRITE_TIMEOUT:30s}
      algorithm-timeout: ${KWIKI_ARCADEDB_ALGORITHM_TIMEOUT:15m}
      max-connections: ${KWIKI_ARCADEDB_MAX_CONNECTIONS:8}
      tls:
        enabled: ${KWIKI_ARCADEDB_TLS_ENABLED:false}
        verify-certificate: ${KWIKI_ARCADEDB_TLS_VERIFY:true}
      temporary-database-prefix: ${KWIKI_ARCADEDB_TEMPORARY_DATABASE_PREFIX:kwiki_leiden_}
      required-server-version: ${KWIKI_ARCADEDB_REQUIRED_SERVER_VERSION:}
  security:
    jwt-secret: ${KWIKI_JWT_SECRET}
    token-ttl: ${KWIKI_JWT_TTL:7d}
    token-renewal-window: ${KWIKI_JWT_RENEWAL_WINDOW:5d}
  content-center:
    base-url: ${KWIKI_CONTENT_CENTER_BASE_URL}
    app-token: ${KWIKI_CONTENT_CENTER_APP_TOKEN}
    source: ${KWIKI_CONTENT_CENTER_SOURCE:}
    path: ${KWIKI_CONTENT_CENTER_PATH:}
    connect-timeout: ${KWIKI_CONTENT_CENTER_CONNECT_TIMEOUT:10s}
    request-timeout: ${KWIKI_CONTENT_CENTER_REQUEST_TIMEOUT:600s}
  elasticsearch:
    uris: ${KWIKI_ELASTICSEARCH_URIS}
    api-key: ${KWIKI_ELASTICSEARCH_API_KEY:}
    username: ${KWIKI_ELASTICSEARCH_USERNAME:}
    password: ${KWIKI_ELASTICSEARCH_PASSWORD:}
  answer-llm:
    base-url: ${KWIKI_ANSWER_LLM_BASE_URL}
    api-key: ${KWIKI_ANSWER_LLM_API_KEY}
    model: ${KWIKI_ANSWER_LLM_MODEL}
    request-timeout: ${KWIKI_ANSWER_LLM_TIMEOUT:120s}
  qwen-embedding:
    base-url: ${KWIKI_QWEN_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${KWIKI_QWEN_EMBEDDING_API_KEY}
    model: ${KWIKI_QWEN_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${KWIKI_QWEN_EMBEDDING_DIMENSIONS:1024}
    request-timeout: ${KWIKI_QWEN_EMBEDDING_TIMEOUT:30s}
  vision-model:
    # 图片摘要视觉模型（OpenAI-compatible /chat/completions）。
    # 多模态索引关闭（默认）时允许为空；启用前必须显式注入。
    base-url: ${KWIKI_VISION_BASE_URL:}
    api-key: ${KWIKI_VISION_API_KEY:}
    model: ${KWIKI_VISION_MODEL:qwen3.7-flash}
    connect-timeout: ${KWIKI_VISION_CONNECT_TIMEOUT:5s}
    request-timeout: ${KWIKI_VISION_TIMEOUT:60s}
    max-retries: ${KWIKI_VISION_MAX_RETRIES:2}
    concurrency: ${KWIKI_VISION_CONCURRENCY:4}
  multimodal:
    # 多模态文档索引（PDF 内嵌图片 + 发布后 Markdown 图片）总开关。
    enabled: ${KWIKI_MULTIMODAL_ENABLED:false}
    prompt-version: ${KWIKI_MULTIMODAL_PROMPT_VERSION:v1}
    max-images-per-document: ${KWIKI_MULTIMODAL_MAX_IMAGES_PER_DOCUMENT:20}
    min-image-pixels: ${KWIKI_MULTIMODAL_MIN_IMAGE_PIXELS:1024}
    max-image-pixels: ${KWIKI_MULTIMODAL_MAX_IMAGE_PIXELS:4194304}
    max-image-bytes: ${KWIKI_MULTIMODAL_MAX_IMAGE_BYTES:10485760}
    max-summary-chars: ${KWIKI_MULTIMODAL_MAX_SUMMARY_CHARS:512}
    max-external-image-bytes: ${KWIKI_MULTIMODAL_MAX_EXTERNAL_IMAGE_BYTES:10485760}
    external-image-timeout: ${KWIKI_MULTIMODAL_EXTERNAL_IMAGE_TIMEOUT:20s}
    external-image-max-redirects: ${KWIKI_MULTIMODAL_EXTERNAL_IMAGE_MAX_REDIRECTS:3}
    external-image-allowed-ports: ${KWIKI_MULTIMODAL_EXTERNAL_IMAGE_ALLOWED_PORTS:443}
  indexing:
    worker:
      enabled: ${KWIKI_INDEXING_WORKER_ENABLED:true}
      batch-size: ${KWIKI_INDEXING_WORKER_BATCH_SIZE:20}
      poll-interval: ${KWIKI_INDEXING_WORKER_POLL_INTERVAL:5s}
      initial-delay: ${KWIKI_INDEXING_WORKER_INITIAL_DELAY:10s}
    bootstrap:
      enabled: ${KWIKI_INDEXING_BOOTSTRAP_ENABLED:true}
      version: ${KWIKI_INDEX_VERSION:1}
    # 受支持的结构配置清单（留空 = 仅支持当前部署配置，即
    # kwiki.qwen-embedding 派生的默认代）。新增升级代时按
    # id/parser-version/chunker-version/embedding-profile/
    # embedding-model/dimensions/mapping-schema-version 列出。
    manifests: []
    # 命名的 embedding 凭据档案；default 档案未配置时回退到
    # kwiki.qwen-embedding.*。密钥只在此处，绝不入库。
    embeddings: {}
    rebuild:
      batch-size: ${KWIKI_INDEX_REBUILD_BATCH_SIZE:50}
      max-concurrent-runs: ${KWIKI_INDEX_REBUILD_MAX_CONCURRENT_RUNS:2}
      embedding-qps: ${KWIKI_INDEX_REBUILD_EMBEDDING_QPS:20}
    catchup:
      batch-size: ${KWIKI_INDEX_CATCHUP_BATCH_SIZE:100}
      scan-interval: ${KWIKI_INDEX_CATCHUP_SCAN_INTERVAL:30s}
    capacity:
      min-storage-headroom-percent: ${KWIKI_INDEX_CAPACITY_MIN_STORAGE_HEADROOM_PERCENT:20}
      max-managed-indices: ${KWIKI_INDEX_CAPACITY_MAX_MANAGED_INDICES:8}
      health-timeout: ${KWIKI_INDEX_CAPACITY_HEALTH_TIMEOUT:5s}
    management:
      # 只读观察模式为默认；运维显式开启后管理端才能执行
      # 创建/编辑/重建/切换/删除等变更。
      mutations-enabled: ${KWIKI_INDEX_MANAGEMENT_MUTATIONS_ENABLED:false}

# kk-common SDK 功能开关。Web 请求上下文与共享异常处理器默认
# 开启；Redis 工具集与 Redisson 锁工厂同为默认开启的正式运行依赖
# （Redis/Redisson 不可达时启动失败或就绪失败——不提供 localhost
# 兜底，必须提供 KWIKI_REDIS_HOST 等连接参数）。隔离环境可显式
# 置 false 关闭；依赖分布式锁的功能随之失败关闭。
kk:
  common:
    web:
      enabled: ${KK_COMMON_WEB_ENABLED:true}
    exception:
      enabled: ${KK_COMMON_EXCEPTION_ENABLED:true}
    redis:
      enabled: ${KK_COMMON_REDIS_ENABLED:true}
    redisson:
      enabled: ${KK_COMMON_REDISSON_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 依赖连通性决定就绪状态；存活状态仅反映进程本身
          include: "readinessState,*"
  tracing:
    sampling:
      # 每个请求都保留 trace id：未配置任何 span exporter，采样
      # 仅保证为日志、X-Trace-Id 与传播链路提供稳定的 traceId。
      probability: 1.0
