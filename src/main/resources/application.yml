spring:
  config:
    import:
      - optional:nacos:kwiki-local.yaml
  cloud:
    nacos:
      config:
        # 连接与认证参数全部来自环境变量，本文件不落任何凭据
        server-addr: ${KWIKI_NACOS_SERVER_ADDR:}
        file-extension: yaml
        group: ${KWIKI_NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${KWIKI_NACOS_NAMESPACE:}
        username: ${KWIKI_NACOS_USERNAME:kwiki}
        password: ${KWIKI_NACOS_PASSWORD:}
        refresh-enabled: true