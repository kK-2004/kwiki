spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: kwiki
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # Redis 支持为可选开启：com.kwiki.infrastructure.redis.KwikiRedisConfiguration
      # 仅在 kk.common.redis.enabled=true 时才重新导入这两个自动配置，
      # 因此在禁用期间 spring.data.redis.*（以及任何客户端）不会被读取或创建。
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${KWIKI_MYSQL_URL}
    username: ${KWIKI_MYSQL_USERNAME}
    password: ${KWIKI_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 时间戳以 UTC Instant 形式持久化；告知 Hibernate 如何将
        # JDBC 连接对齐到 UTC，使 DATETIME 列无损往返。
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
  data:
    redis:
      host: ${KWIKI_REDIS_HOST}
      port: ${KWIKI_REDIS_PORT:6379}
      password: ${KWIKI_REDIS_PASSWORD:}
      database: ${KWIKI_REDIS_DATABASE:0}
  elasticsearch:
    uris: ${KWIKI_ELASTICSEARCH_URIS}
    # basic 认证（为空则不启用）；API key 使用 kwiki.elasticsearch.api-key
    username: ${KWIKI_ELASTICSEARCH_USERNAME:}
    password: ${KWIKI_ELASTICSEARCH_PASSWORD:}

kwiki:
  time:
    display-zone: ${KWIKI_TIME_DISPLAY_ZONE:Asia/Shanghai}
  security:
    jwt-secret: ${KWIKI_JWT_SECRET}
    token-ttl: ${KWIKI_JWT_TTL:7d}
    token-renewal-window: ${KWIKI_JWT_RENEWAL_WINDOW:5d}
  content-center:
    base-url: ${KWIKI_CONTENT_CENTER_BASE_URL}
    app-token: ${KWIKI_CONTENT_CENTER_APP_TOKEN}
    source: ${KWIKI_CONTENT_CENTER_SOURCE:}
    path: ${KWIKI_CONTENT_CENTER_PATH:}
    connect-timeout: ${KWIKI_CONTENT_CENTER_CONNECT_TIMEOUT:10s}
    request-timeout: ${KWIKI_CONTENT_CENTER_REQUEST_TIMEOUT:600s}
  elasticsearch:
    uris: ${KWIKI_ELASTICSEARCH_URIS}
    api-key: ${KWIKI_ELASTICSEARCH_API_KEY:}
    username: ${KWIKI_ELASTICSEARCH_USERNAME:}
    password: ${KWIKI_ELASTICSEARCH_PASSWORD:}
  answer-llm:
    base-url: ${KWIKI_ANSWER_LLM_BASE_URL}
    api-key: ${KWIKI_ANSWER_LLM_API_KEY}
    model: ${KWIKI_ANSWER_LLM_MODEL}
    request-timeout: ${KWIKI_ANSWER_LLM_TIMEOUT:120s}
  qwen-embedding:
    base-url: ${KWIKI_QWEN_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${KWIKI_QWEN_EMBEDDING_API_KEY}
    model: text-embedding-v4
    dimensions: ${KWIKI_QWEN_EMBEDDING_DIMENSIONS:1024}
    request-timeout: ${KWIKI_QWEN_EMBEDDING_TIMEOUT:30s}

# kk-common SDK 功能开关。Web 请求上下文与共享异常
# 处理器默认开启；Redis 工具集与 Redisson 锁工厂为
# 可选开启，在显式启用前保持完全未连接（部署时若
# 启用其中任一，必须同时提供 KWIKI_REDIS_HOST 等相关变量）。
kk:
  common:
    web:
      enabled: ${KK_COMMON_WEB_ENABLED:true}
    exception:
      enabled: ${KK_COMMON_EXCEPTION_ENABLED:true}
    redis:
      enabled: ${KK_COMMON_REDIS_ENABLED:false}
    redisson:
      enabled: ${KK_COMMON_REDISSON_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 依赖连通性决定就绪状态；存活状态仅反映进程本身
          include: "readinessState,*"
  tracing:
    sampling:
      # 每个请求都保留 trace id：未配置任何 span exporter，采样
      # 仅保证为日志、X-Trace-Id 与传播链路提供稳定的 traceId。
      probability: 1.0
