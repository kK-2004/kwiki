# 本地开发 profile。仍然不含任何凭据：所有密钥依旧来自
# KWIKI_* 环境变量（见 .env.example）；本文件只调整非密钥类的
# 默认值与日志配置，供开发者工作站使用。
logging:
  level:
    com.kwiki: DEBUG
    org.springframework.web: INFO

spring:
  application:
    name: kwiki
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${KWIKI_MYSQL_URL:jdbc:mysql://localhost:3306/kwiki?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${KWIKI_MYSQL_USERNAME:root}
    password: ${KWIKI_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 时间戳以 UTC Instant 持久化；将 JDBC 连接对齐到 UTC，
        # 以便 DATETIME 列无损往返。
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
  data:
    redis:
      # 没有 localhost 兜底：启用 Redis 功能（KK_COMMON_REDIS_ENABLED=true）
      # 时必须显式提供 host，因此启动过程绝不会静默选中 localhost:6379。
      host: ${KWIKI_REDIS_HOST}
      port: ${KWIKI_REDIS_PORT:6379}
      password: ${KWIKI_REDIS_PASSWORD:}
      database: ${KWIKI_REDIS_DATABASE:0}
  elasticsearch:
    uris: ${KWIKI_ELASTICSEARCH_URIS:https://es-louis.ksite.xin}
    # 基础认证（为空 -> 不启用）；API 密钥使用 kwiki.elasticsearch.api-key

kwiki:
  time:
    display-zone: ${KWIKI_TIME_DISPLAY_ZONE:Asia/Shanghai}
  security:
    jwt-secret: ${KWIKI_JWT_SECRET:"kwiki-jwt-secretkwiki-jwt-secret1"}
    token-ttl: ${KWIKI_JWT_TTL:7d}
    token-renewal-window: ${KWIKI_JWT_RENEWAL_WINDOW:5d}
  content-center:
    base-url: ${KWIKI_CONTENT_CENTER_BASE_URL:https://file.ksite.xin}
    app-token: ${KWIKI_CONTENT_CENTER_APP_TOKEN}
    source: ${KWIKI_CONTENT_CENTER_SOURCE:}
    path: ${KWIKI_CONTENT_CENTER_PATH:}
    connect-timeout: ${KWIKI_CONTENT_CENTER_CONNECT_TIMEOUT:10s}
    request-timeout: ${KWIKI_CONTENT_CENTER_REQUEST_TIMEOUT:600s}
  elasticsearch:
    api-key: ${KWIKI_ELASTICSEARCH_API_KEY:}
  answer-llm:
    base-url: ${KWIKI_ANSWER_LLM_BASE_URL:https://llm-svsyrrepiflr3w72.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${KWIKI_ANSWER_LLM_API_KEY}
    model: ${KWIKI_ANSWER_LLM_MODEL:deepseek-v4-pro-0813}
    request-timeout: ${KWIKI_ANSWER_LLM_TIMEOUT:120s}
  qwen-embedding:
    base-url: ${KWIKI_QWEN_EMBEDDING_BASE_URL:https://llm-svsyrrepiflr3w72.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${KWIKI_QWEN_EMBEDDING_API_KEY}
    model: ${KWIKI_ANSWER_LLM_MODEL:qwen3.7-text-embedding}
    dimensions: ${KWIKI_QWEN_EMBEDDING_DIMENSIONS:1024}
    request-timeout: ${KWIKI_QWEN_EMBEDDING_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 依赖连通性决定就绪状态；存活状态仅反映进程本身
          include: "readinessState,*"
